<!DOCTYPE html>
<html>
<head>
    <title>AI Calculator</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            padding: 15px;
            font-family: Arial;
            background: linear-gradient(to right, #1e3c72, #2a5298);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* 🔥 Responsive Glass UI */
        .container {
            width: 90%;
            max-width: 550px;
            padding: 35px;
            border-radius: 25px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(15px);
            box-shadow: 0 0 50px rgba(0,0,0,0.6);
            color: white;
        }

        h2 {
            text-align: center;
            font-size: 28px;
        }

        input, select {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border-radius: 10px;
            border: none;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 16px;
            outline: none;
        }

        /* ✅ Placeholder fix */
        input::placeholder {
            color: rgba(255,255,255,0.7);
        }

        select option {
            color: black;
        }

        /* 🔥 Button */
        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(to right, #00c6ff, #0072ff);
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
        }

        button.loading {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* 🔥 Logs */
        #logs {
            margin-top: 20px;
            padding: 15px;
            border-radius: 15px;
            background: rgba(0,0,0,0.3);
            font-size: 15px;
            color: #00e5ff;
            min-height: 160px;
        }

        .line {
            opacity: 0;
            animation: fadeIn 0.5s forwards;
        }

        @keyframes fadeIn {
            to {opacity: 1;}
        }

        /* 🔥 Result (hidden initially) */
        #result {
            display: none;
            margin-top: 20px;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            background: rgba(255,255,255,0.1);
            font-size: 26px;
            color: #00ffcc;

            opacity: 0;
            transition: opacity 0.5s ease;
        }

        #result.show {
            opacity: 1;
        }

        /* 🔥 Background animation */
        #bgEffect {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .processing-bg {
            background: radial-gradient(circle, rgba(0,255,255,0.2), transparent);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {opacity: 0.3;}
            50% {opacity: 0.7;}
            100% {opacity: 0.3;}
        }

        /* 📱 Mobile optimization */
        @media (max-width: 480px) {
            h2 {
                font-size: 22px;
            }

            input, select {
                font-size: 14px;
                padding: 12px;
            }

            button {
                font-size: 16px;
                padding: 14px;
            }

            #result {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

<div id="bgEffect"></div>

<div class="container">
    <h2>AI Calculator</h2>

    <input type="number" placeholder="Enter first number">
    <input type="number" placeholder="Enter second number">

    <select>
        <option>Addition</option>
        <option>Subtraction</option>
        <option>Multiplication</option>
        <option>Division</option>
    </select>

    <button id="btn" onclick="startProcess()">Calculate</button>

    <div id="logs"></div>
    <div id="result"></div>
</div>

<script>
function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

async function startProcess() {

    let logs = document.getElementById("logs");
    let result = document.getElementById("result");
    let bg = document.getElementById("bgEffect");
    let btn = document.getElementById("btn");

    logs.innerHTML = "";
    result.innerHTML = "";

    // hide result
    result.style.display = "none";
    result.classList.remove("show");

    // start animation
    bg.classList.add("processing-bg");
    btn.classList.add("loading");
    btn.innerText = "Processing...";

    let steps = [
        "Initializing AI core...",
        "Fetching data from NASA servers...",
        "Installing Einstein mind module...",
        "Reading secret NASA research papers...",
        "Optimizing multiverse calculations...",
        "Decrypting alien mathematics...",
        "Finalizing calculations..."
    ];

    for (let step of steps) {
        let line = document.createElement("div");
        line.className = "line";
        line.innerText = "> " + step;
        logs.appendChild(line);

        await sleep(3000);
    }

    await sleep(1000);

    // stop animation
    bg.classList.remove("processing-bg");
    btn.classList.remove("loading");
    btn.innerText = "Calculate";

    // show result
    result.style.display = "block";
    result.innerText = "Hello World";

    setTimeout(() => {
        result.classList.add("show");
    }, 50);
}
</script>

</body>
</html>
